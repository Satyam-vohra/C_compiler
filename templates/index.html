<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Modular Compiler - Universe Edition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Monaco Editor Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <div class="app-container glass-panel">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-rocket"></i>
                <h1>Secure Modular Compiler <span>Universe Edition</span></h1>
            </div>
            <div class="header-actions">
                <button id="runBtn" class="btn btn-primary">
                    <i class="fa-solid fa-play"></i> Compile & Run
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar / File Explorer -->
            <aside class="sidebar glass-panel">
                <div class="sidebar-header">
                    <h2><i class="fa-solid fa-folder-tree"></i> Explorer</h2>
                    <button id="refreshBtn" class="btn-icon" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div id="fileTree" class="file-tree">
                    <!-- File tree populated by JS -->
                </div>
            </aside>

            <!-- Editor Pane -->
            <main class="editor-pane">
                <div class="pane-header">
                    <h2 id="currentFileName">untitled.c</h2>
                </div>
                <div id="monaco-editor" class="editor-container"></div>
            </main>
        </div>

        <!-- Bottom Panel: Output / Terminal -->
        <div class="bottom-panel glass-panel">
            <div class="panel-tabs">
                <button class="tab-btn active" data-target="execution-output">Execution Output</button>
                <button class="tab-btn" data-target="compiler-logs">Compiler Logs</button>
                <button class="tab-btn" data-target="generated-code">Generated C Code</button>
            </div>
            
            <div class="panel-content">
                <div id="execution-output" class="tab-content active">
                    <pre class="terminal-output">Press 'Compile & Run' to see execution output here...</pre>
                </div>
                <div id="compiler-logs" class="tab-content">
                    <pre class="terminal-output">Compiler logs will appear here...</pre>
                </div>
                <div id="generated-code" class="tab-content">
                    <pre class="terminal-output">Generated code will appear here...</pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
